function renderQuestion(){
  const q = questions[currentQ];
  document.getElementById("qNum").innerText = `第${currentQ+1}题 / ${questions.length}题`;
  document.getElementById("qTitle").innerText = q[0];
  document.getElementById("progressBar").style.width = ((currentQ+1)/questions.length*100)+"%";
  const wrap = document.getElementById("optionsWrap");
  wrap.innerHTML="";
  for(let i=1;i<=4;i++){
    const opt = q[i];
    const div = document.createElement("div");
    div.className = "option-item"+(answers[currentQ]===i?" selected":"");
    div.innerText = opt[0];
    div.onclick = ()=>{
      answers[currentQ]=i;
      renderQuestion();
    }
    wrap.appendChild(div);
  }
}

  if(currentQ>0){
    currentQ--;

  }
  // 修复判断：到最后一题，直接计算结果
  if(currentQ >= questions.length - 1){
    calcResult();
  }else{
    currentQ++;
    renderQuestion();
  }
}
function calcResult(){
  scores = {LN:0,XF:0,QZ:0,BXC:0,MTY:0,ZM:0};
  for(let i=0;i<questions.length;i++){
    const sel = answers[i];
    if(sel===null) continue;
    const opt = questions[i][sel];
    scores.LN += opt[1];
    scores.XF += opt[2];
    scores.QZ += opt[3];
    scores.BXC += opt[4];
    scores.MTY += opt[5];
    scores.ZM += opt[6];
  }
  // 排序
  let arr = labelKeys.map(k=>({key:k,val:scores[k]}));
  arr.sort((a,b)=>b.val-a.val);
  const main = arr[0];
  const sub = arr[1];
  const data = resultData[main.key];
  // 渲染文字
  document.getElementById("resMainName").innerText = data.name;
  document.getElementById("resSlogan").innerText = data.slogan;
  document.getElementById("resSub").innerText = "✨你的隐藏副人格："+resultData[sub.key].name;
  document.getElementById("resText1").innerText = data.t1;
  document.getElementById("resText2").innerText = data.t2;
  document.getElementById("resText3").innerText = data.t3;
  document.getElementById("resText4").innerText = data.t4;
  document.getElementById("resText5").innerText = data.t5;
  // 雷达图
  const ctx = document.getElementById("radarChart").getContext("2d");
  if(radarChart) radarChart.destroy();
  const vals = [scores.LN,scores.XF,scores.QZ,scores.BXC,scores.MTY,scores.ZM];
  radarChart = new Chart(ctx,{
    type:"radar",
    data:{
      labels:labelNames,
      datasets:[{
        label:"天赋占比",
        data:vals,
        backgroundColor:"rgba(184,92,92,0.15)",
        borderColor:"#b85c5c",
        pointBackgroundColor:"#b85c5c"
      }]
    },
    options:{scales:{r:{min:0,max:135}}}
  });
  showPage("page-result");
}
</script>
</body>
